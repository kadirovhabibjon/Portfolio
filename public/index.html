<!doctype html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="utf-8">
  <script>
    // Sayt istalgan papkada ishlashi uchun (masalan GitHub Pages: /Portfolio/) — barcha nisbiy yo'llar sayt ildiziga nisbatan
    (function () {
      var base = document.createElement("base");
      base.href = location.pathname.replace(/(contact\/?|index\.html)$/, "").replace(/\/?$/, "/");
      document.head.appendChild(base);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habibjon Kadirov — Portfolio</title>
  <meta name="description" content="Habibjon Kadirov — portfolio, experience, projects and contacts.">
  <link rel="icon" href="assets/avatar.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch (e) {}
  </script>
</head>
<body>
  <div id="snow" aria-hidden="true"></div>

  <header class="container">
    <nav class="nav card">
      <a href="./" class="logo" aria-label="Home" data-route>
        <svg viewBox="0 0 24 24" width="26" height="26"><rect x="2" y="2" width="9" height="20" rx="2"/><rect x="13" y="2" width="9" height="9" rx="2"/><rect x="13" y="13" width="9" height="9" rx="2"/></svg>
      </a>
      <ul class="nav-links">
        <li><a href="./" data-route data-nav="home" data-i18n="nav.home"></a></li>
        <li><a href="./#projects" data-route data-nav="projects" data-i18n="nav.projects"></a></li>
        <li><a href="contact/" data-route data-nav="contact" data-i18n="nav.contact"></a></li>
      </ul>
      <div class="nav-actions">
        <div class="lang">
          <button id="langBtn" class="icon-btn" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h8M8 3v2M6 5c0 4 3 7 6 8M10 5c0 4-3 8-6 9M13 21l4-9 4 9M14.5 18h5"/></svg>
            <span id="langLabel">UZ</span>
          </button>
          <ul id="langMenu" class="lang-menu" hidden>
            <li><button data-lang="uz">O'zbekcha</button></li>
            <li><button data-lang="ru">Русский</button></li>
            <li><button data-lang="en">English</button></li>
          </ul>
        </div>
        <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">
          <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a id="ctaTop" class="btn btn-dark" href="contact/" data-route><span data-i18n="cta.work"></span> <span aria-hidden="true">↘</span></a>
      </div>
    </nav>
  </header>

  <main class="container" id="home">
    <section class="bento">
      <!-- Profile -->
      <article class="card profile">
        <img id="photo" class="photo" alt="">
        <h1 class="name"><span id="name"></span> <span class="wave">👋</span></h1>
        <p class="muted" id="title"></p>
        <div class="profile-btns">
          <a id="contactBtn" class="btn btn-primary" href="contact/" data-route>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            <span data-i18n="btn.contact"></span>
          </a>
          <a id="resumeBtn" class="btn btn-outline" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>
            <span data-i18n="btn.resume"></span>
          </a>
          <button id="eduBtn" class="btn btn-outline">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>
            <span data-i18n="btn.education"></span>
          </button>
        </div>
        <div class="socials" id="socials"></div>
      </article>

      <!-- Experience + Stack -->
      <div class="col">
        <article class="card">
          <h2 data-i18n="sec.experience"></h2>
          <ul class="timeline" id="experience"></ul>
        </article>
        <article class="card">
          <h2>Tech Stack</h2>
          <div class="stack" id="stack"></div>
        </article>
      </div>

      <!-- Projects preview -->
      <article class="card projects-preview" id="projects">
        <div class="card-head">
          <h2 data-i18n="sec.projects"></h2>
          <button type="button" id="allProjectsBtn" class="link"><span data-i18n="btn.viewAll"></span> →</button>
        </div>
        <div class="preview-list" id="projectsPreview"></div>
      </article>

      <!-- Videos -->
      <article class="card wide" id="videosCard">
        <div class="card-head">
          <h2 data-i18n="sec.videos"></h2>
        </div>
        <div class="videos" id="videos"></div>
      </article>

      <!-- Let's work -->
      <article class="card work">
        <div class="marquee"><span data-i18n="marquee"></span><span data-i18n="marquee" aria-hidden="true"></span><span data-i18n="marquee" aria-hidden="true"></span><span data-i18n="marquee" aria-hidden="true"></span></div>
        <h3>🤝 <span data-i18n="cta.workQ"></span></h3>
        <a href="contact/" class="link" data-route><span data-i18n="btn.connect"></span> ↘</a>
      </article>

      <!-- Contact page (/contact) -->
      <article class="card contact-card">
        <div class="contact-head">
          <h1 class="contact-title">
            <span data-i18n="contact.t1"></span><span class="accent" data-i18n="contact.t2"></span><span data-i18n="contact.t3"></span>
            <span class="wave">👋</span>
          </h1>
          <span class="online"><i></i><span data-i18n="contact.online"></span></span>
        </div>
        <p class="contact-text"><span data-i18n="contact.text"></span> <strong data-i18n="contact.strong"></strong></p>
        <div class="contact-tiles" id="contactTiles"></div>
      </article>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <footer class="container footer muted">
    © <span id="year"></span> <span id="footerName"></span>
  </footer>

  <dialog id="eduDialog" class="dialog">
    <div class="card-head">
      <h2 data-i18n="btn.education"></h2>
      <button class="icon-btn" id="eduClose" aria-label="Close">✕</button>
    </div>
    <ul class="timeline" id="education"></ul>
  </dialog>

  <dialog id="projectsDialog" class="dialog dialog-wide">
    <div class="card-head">
      <h2 data-i18n="sec.projects"></h2>
      <button class="icon-btn" id="projectsClose" aria-label="Close">✕</button>
    </div>
    <div class="projects-grid" id="projectsGrid"></div>
  </dialog>

  <script src="js/icons.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
